<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ app_title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/dashboard.css" />
    <style>
      .chat-shell { display: flex; height: 100vh; overflow: hidden; background: var(--bg, #faf9f7); }
      .chat-sidebar { width: 320px; min-width: 260px; border-right: 1px solid #e8e3dc; display: flex; flex-direction: column; background: #fff; }
      .chat-sidebar-head { padding: 20px 20px 12px; border-bottom: 1px solid #e8e3dc; }
      .chat-sidebar-head a { font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #888; text-decoration: none; }
      .chat-sidebar-head a:hover { color: #333; }
      .chat-sidebar-head h1 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 700; margin: 6px 0 0; }
      .conv-list { flex: 1; overflow-y: auto; }
      .conv-item { display: flex; align-items: center; gap: 12px; padding: 14px 20px; cursor: pointer; border-bottom: 1px solid #f0ece6; transition: background 0.15s; }
      .conv-item:hover, .conv-item.is-active { background: #f5f1eb; }
      .conv-avatar { width: 42px; height: 42px; border-radius: 50%; background: #2d2926; color: #fff; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 16px; font-weight: 700; flex-shrink: 0; }
      .conv-meta { min-width: 0; flex: 1; }
      .conv-name { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; font-weight: 600; color: #1a1614; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .conv-preview { font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
      .conv-time { font-family: 'IBM Plex Sans', sans-serif; font-size: 11px; color: #aaa; flex-shrink: 0; }

      .chat-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      .chat-header { padding: 16px 24px; border-bottom: 1px solid #e8e3dc; background: #fff; display: flex; align-items: center; gap: 12px; }
      .chat-header-avatar { width: 38px; height: 38px; border-radius: 50%; background: #2d2926; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; font-family: 'Bricolage Grotesque', sans-serif; }
      .chat-header-info h2 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 16px; font-weight: 700; margin: 0; }
      .chat-header-info p { font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #888; margin: 2px 0 0; }
      .chat-messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 10px; background: #f5f1eb; }
      .msg-bubble { max-width: 70%; padding: 10px 14px; border-radius: 12px; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.5; word-break: break-word; }
      .msg-bubble.out { align-self: flex-end; background: #2d2926; color: #fff; border-bottom-right-radius: 3px; }
      .msg-bubble.in { align-self: flex-start; background: #fff; color: #1a1614; border-bottom-left-radius: 3px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
      .msg-time { font-size: 10px; margin-top: 4px; opacity: 0.6; }
      .msg-out-wrap { display: flex; flex-direction: column; align-items: flex-end; }
      .msg-in-wrap { display: flex; flex-direction: column; align-items: flex-start; }
      .chat-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: #aaa; font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; background: #f5f1eb; }
      .chat-loading { text-align: center; padding: 40px; color: #aaa; font-family: 'IBM Plex Sans', sans-serif; }
      .refresh-bar { padding: 8px 24px; background: #fff; border-top: 1px solid #e8e3dc; display: flex; align-items: center; justify-content: space-between; }
      .refresh-bar span { font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; color: #aaa; }
      .refresh-bar button { font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; background: none; border: 1px solid #ddd; border-radius: 6px; padding: 4px 12px; cursor: pointer; color: #555; }
      .refresh-bar button:hover { background: #f5f1eb; }
      .no-convs { padding: 40px 20px; text-align: center; color: #aaa; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="chat-shell">
      <aside class="chat-sidebar">
        <div class="chat-sidebar-head">
          <a href="/">← Dashboard</a>
          <h1>Chats</h1>
        </div>
        <div class="conv-list" id="conv-list">
          <div class="chat-loading">Loading…</div>
        </div>
      </aside>

      <main class="chat-main">
        <div id="chat-header" class="chat-header" style="display:none">
          <div class="chat-header-avatar" id="header-avatar"></div>
          <div class="chat-header-info">
            <h2 id="header-name"></h2>
            <p id="header-number"></p>
          </div>
        </div>
        <div id="chat-empty" class="chat-empty">Select a conversation</div>
        <div id="chat-messages" class="chat-messages" style="display:none"></div>
        <div class="refresh-bar">
          <span id="last-refresh">—</span>
          <button id="refresh-btn" type="button">Refresh</button>
        </div>
      </main>
    </div>

    <script>
      let conversations = [];
      let activeNumber = null;

      function initials(name) {
        return name.split(' ').slice(0, 2).map(w => w[0] || '').join('').toUpperCase() || '?';
      }

      function fmtTime(ts) {
        if (!ts) return '';
        try {
          const d = new Date(ts);
          return d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
        } catch { return ts.slice(11, 16) || ''; }
      }

      function fmtDate(ts) {
        if (!ts) return '';
        try {
          const d = new Date(ts);
          const today = new Date();
          if (d.toDateString() === today.toDateString()) return fmtTime(ts);
          return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' });
        } catch { return ts.slice(0, 10) || ''; }
      }

      function renderSidebar() {
        const list = document.getElementById('conv-list');
        if (!conversations.length) {
          list.innerHTML = '<div class="no-convs">No conversations yet.</div>';
          return;
        }
        list.innerHTML = conversations.map(c => `
          <div class="conv-item${c.number === activeNumber ? ' is-active' : ''}" data-number="${c.number}">
            <div class="conv-avatar">${initials(c.name)}</div>
            <div class="conv-meta">
              <div class="conv-name">${esc(c.name)}</div>
              <div class="conv-preview">${esc((c.messages.at(-1) || {}).text || '')}</div>
            </div>
            <div class="conv-time">${fmtDate(c.last_timestamp)}</div>
          </div>`).join('');

        list.querySelectorAll('.conv-item').forEach(el => {
          el.addEventListener('click', () => selectConv(el.dataset.number));
        });
      }

      function selectConv(number) {
        activeNumber = number;
        const conv = conversations.find(c => c.number === number);
        if (!conv) return;

        document.getElementById('chat-empty').style.display = 'none';
        document.getElementById('chat-header').style.display = 'flex';
        document.getElementById('chat-messages').style.display = 'flex';
        document.getElementById('header-avatar').textContent = initials(conv.name);
        document.getElementById('header-name').textContent = conv.name;
        document.getElementById('header-number').textContent = '+' + conv.number;

        const box = document.getElementById('chat-messages');
        box.innerHTML = conv.messages.map(m => `
          <div class="msg-${m.direction}-wrap">
            <div class="msg-bubble ${m.direction}">${esc(m.text).replace(/\n/g, '<br>')}</div>
            <div class="msg-time">${fmtTime(m.timestamp)}</div>
          </div>`).join('');
        box.scrollTop = box.scrollHeight;

        renderSidebar();
      }

      function esc(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }

      async function load() {
        try {
          const res = await fetch('/api/chats');
          if (!res.ok) throw new Error(res.status);
          const data = await res.json();
          conversations = data.conversations || [];
          renderSidebar();
          if (activeNumber) selectConv(activeNumber);
          document.getElementById('last-refresh').textContent = 'Updated ' + new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
        } catch (e) {
          document.getElementById('conv-list').innerHTML = '<div class="no-convs">Failed to load. Check API.</div>';
        }
      }

      document.getElementById('refresh-btn').addEventListener('click', load);
      load();
      setInterval(load, 30000);
    </script>
  </body>
</html>
