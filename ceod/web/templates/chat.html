<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CEO Mission Control - Chats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/dashboard.css" />
  </head>
  <body class="chat-page">
    <div class="chat-shell">
      <aside class="chat-sidebar">
        <div class="chat-sidebar-head">
          <a class="back-link" href="/">Back to dashboard</a>
          <p class="eyebrow">Live Messages</p>
          <h1>Chats</h1>
          <p class="chat-sidebar-text">
            Open any thread to read the latest exchange and keep the team context close.
          </p>
        </div>
        <div class="conv-list" id="conv-list">
          <div class="chat-loading">Loading...</div>
        </div>
      </aside>

      <main class="chat-main">
        <div id="chat-header" class="chat-header" style="display:none">
          <div class="chat-header-avatar" id="header-avatar"></div>
          <div class="chat-header-info">
            <h2 id="header-name"></h2>
            <p id="header-number"></p>
          </div>
        </div>
        <div id="chat-empty" class="chat-empty">
          <div class="chat-empty-card">
            <p class="eyebrow">Inbox</p>
            <h2>Select a conversation</h2>
            <p>Pick a thread from the left to read the latest messages.</p>
          </div>
        </div>
        <div id="chat-messages" class="chat-messages" style="display:none"></div>
        <div class="refresh-bar">
          <span id="last-refresh">-</span>
          <button id="refresh-btn" class="ghost-button chat-refresh-button" type="button">
            Refresh
          </button>
        </div>
      </main>
    </div>

    <script>
      let conversations = [];
      let activeNumber = null;

      function initials(name) {
        return name.split(" ").slice(0, 2).map((word) => word[0] || "").join("").toUpperCase() || "?";
      }

      function fmtTime(ts) {
        if (!ts) return "";
        try {
          const date = new Date(ts);
          return date.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" });
        } catch {
          return ts.slice(11, 16) || "";
        }
      }

      function fmtDate(ts) {
        if (!ts) return "";
        try {
          const date = new Date(ts);
          const today = new Date();
          if (date.toDateString() === today.toDateString()) return fmtTime(ts);
          return date.toLocaleDateString("en-IN", { day: "2-digit", month: "short" });
        } catch {
          return ts.slice(0, 10) || "";
        }
      }

      function esc(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function renderSidebar() {
        const list = document.getElementById("conv-list");
        if (!conversations.length) {
          list.innerHTML = '<div class="no-convs">No conversations yet.</div>';
          return;
        }

        list.innerHTML = conversations.map((conversation) => `
          <div class="conv-item${conversation.number === activeNumber ? " is-active" : ""}" data-number="${conversation.number}">
            <div class="conv-avatar">${initials(conversation.name)}</div>
            <div class="conv-meta">
              <div class="conv-name">${esc(conversation.name)}</div>
              <div class="conv-preview">${esc((conversation.messages.at(-1) || {}).text || "")}</div>
            </div>
            <div class="conv-time">${fmtDate(conversation.last_timestamp)}</div>
          </div>
        `).join("");

        list.querySelectorAll(".conv-item").forEach((element) => {
          element.addEventListener("click", () => selectConv(element.dataset.number));
        });
      }

      function selectConv(number) {
        activeNumber = number;
        const conversation = conversations.find((entry) => entry.number === number);
        if (!conversation) return;

        document.getElementById("chat-empty").style.display = "none";
        document.getElementById("chat-header").style.display = "flex";
        document.getElementById("chat-messages").style.display = "flex";
        document.getElementById("header-avatar").textContent = initials(conversation.name);
        document.getElementById("header-name").textContent = conversation.name;
        document.getElementById("header-number").textContent = "+" + conversation.number;

        const box = document.getElementById("chat-messages");
        box.innerHTML = conversation.messages.map((message) => `
          <div class="msg-${message.direction}-wrap">
            <div class="msg-bubble ${message.direction}">${esc(message.text).replace(/\n/g, "<br>")}</div>
            <div class="msg-time">${fmtTime(message.timestamp)}</div>
          </div>
        `).join("");
        box.scrollTop = box.scrollHeight;

        renderSidebar();
      }

      async function load() {
        try {
          const res = await fetch("/api/chats");
          if (!res.ok) throw new Error(res.status);
          const data = await res.json();
          conversations = data.conversations || [];
          renderSidebar();
          if (activeNumber) selectConv(activeNumber);
          document.getElementById("last-refresh").textContent = "Updated " + new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" });
        } catch {
          document.getElementById("conv-list").innerHTML = '<div class="no-convs">Failed to load. Check API.</div>';
        }
      }

      document.getElementById("refresh-btn").addEventListener("click", load);
      load();
      setInterval(load, 30000);
    </script>
  </body>
</html>
