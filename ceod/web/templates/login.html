<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — CEO Mission Control</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Hanken Grotesk", sans-serif;
        color: #171411;
        background:
          radial-gradient(circle at top left, rgba(47,111,102,0.12), transparent 28%),
          radial-gradient(circle at bottom right, rgba(176,132,47,0.10), transparent 26%),
          linear-gradient(180deg, #f7f4ef 0%, #f1ece5 100%);
      }

      .login-card {
        width: min(420px, calc(100vw - 32px));
        padding: 40px 36px;
        background: rgba(255,255,255,0.92);
        border: 1px solid rgba(24,21,18,0.11);
        border-radius: 28px;
        box-shadow: 0 24px 72px rgba(24,21,18,0.09);
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
      }

      .login-eyebrow {
        margin: 0 0 6px;
        font-size: 0.74rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #b0842f;
      }

      .login-title {
        margin: 0 0 6px;
        font-family: "Hanken Grotesk", sans-serif;
        font-size: 1.8rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: #171411;
      }

      .login-sub {
        margin: 0 0 28px;
        font-size: 0.88rem;
        color: #615950;
        line-height: 1.5;
      }

      .field {
        display: grid;
        gap: 6px;
        margin-bottom: 14px;
      }

      .field span {
        font-size: 0.82rem;
        font-weight: 600;
        color: #615950;
      }

      .field input {
        width: 100%;
        padding: 11px 14px;
        font: inherit;
        font-size: 0.92rem;
        background: #f7f4ef;
        border: 1px solid rgba(24,21,18,0.14);
        border-radius: 12px;
        outline: none;
        color: #171411;
        transition: border-color 0.15s;
      }

      .field input:focus {
        border-color: #2f6f66;
        background: #fff;
      }

      .login-btn {
        width: 100%;
        margin-top: 8px;
        padding: 13px;
        font: inherit;
        font-size: 0.92rem;
        font-weight: 600;
        background: #2f6f66;
        color: #fff;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.15s, transform 0.12s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-decoration: none;
      }

      .login-btn:hover { background: #234c46; transform: translateY(-1px); }
      .login-btn:active { transform: none; }

      .login-btn svg { flex-shrink: 0; }

      .login-error {
        margin: 14px 0 0;
        padding: 11px 14px;
        background: rgba(165,55,43,0.08);
        border: 1px solid rgba(165,55,43,0.18);
        border-radius: 10px;
        font-size: 0.84rem;
        color: #a5372b;
        display: none;
      }

      .login-error.is-visible { display: block; }
    </style>
  </head>
  <body>
    <div class="login-card">
      <p class="login-eyebrow">CEO Mission Control</p>
      <h1 class="login-title">Sign in</h1>
      <p class="login-sub">Sign in with your company Google account to access the dashboard.</p>

      <a class="login-btn" href="/auth/login?next={{ next }}">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#fff" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/>
          <path fill="#fff" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.83.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.94v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#fff" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.94A9 9 0 0 0 0 9c0 1.45.35 2.83.94 4.03l3.01-2.33z"/>
          <path fill="#fff" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .94 4.97l3.01 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
        </svg>
        Continue with Google
      </a>
      {% if error %}
      <p class="login-error is-visible">{{ error }}</p>
      {% endif %}
    </div>
  </body>
</html>
