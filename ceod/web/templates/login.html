<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — CEO Mission Control</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Hanken Grotesk", sans-serif;
        color: #171411;
        background: #f4f5f7;
      }

      .login-card {
        width: min(360px, calc(100vw - 32px));
        padding: 24px;
        background: #fff;
        border: 1px solid rgba(23, 26, 31, 0.09);
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(23, 26, 31, 0.08);
      }

      .login-header {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .login-mark {
        width: 40px;
        height: 40px;
        flex-shrink: 0;
        border-radius: 10px;
        background: #2f6f66;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 1.05rem;
      }

      .login-header-text {
        min-width: 0;
      }

      .login-title {
        margin: 0;
        font-size: 0.98rem;
        font-weight: 700;
        color: #171411;
      }

      .login-subtitle {
        margin: 2px 0 0;
        font-size: 0.82rem;
        color: #6b7280;
      }

      .login-divider {
        border: none;
        border-top: 1px solid rgba(23, 26, 31, 0.09);
        margin: 18px 0;
      }

      .login-error {
        margin: 0 0 14px;
        padding: 10px 12px;
        background: rgba(179, 55, 42, 0.08);
        border: 1px solid rgba(179, 55, 42, 0.18);
        border-radius: 10px;
        font-size: 0.84rem;
        color: #a5372b;
      }

      .login-btn {
        width: 100%;
        padding: 11px;
        font: inherit;
        font-size: 0.9rem;
        font-weight: 600;
        background: #fff;
        color: #171411;
        border: 1px solid rgba(23, 26, 31, 0.14);
        border-radius: 10px;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-decoration: none;
      }

      .login-btn:hover {
        background: #f7f8fa;
        border-color: rgba(23, 26, 31, 0.22);
      }

      .login-btn svg { flex-shrink: 0; }

      .login-helper {
        margin: 14px 0 0;
        font-size: 0.78rem;
        color: #9aa1ac;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="login-header">
        <div class="login-mark">C</div>
        <div class="login-header-text">
          <p class="login-title">CEO Mission Control</p>
          <p class="login-subtitle">Task delegation dashboard</p>
        </div>
      </div>
      <hr class="login-divider" />

      {% if error %}
      <p class="login-error">{{ error }}</p>
      {% endif %}

      <a class="login-btn" href="/auth/login?next={{ next }}">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.72v2.26h2.9c1.7-1.57 2.68-3.88 2.68-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.83.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.34C2.44 15.98 5.48 18 9 18z"/>
          <path fill="#FBBC05" d="M3.95 10.7c-.18-.54-.28-1.12-.28-1.7s.1-1.16.28-1.7V4.96H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.04l2.99-2.34z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.96l2.99 2.34C4.66 5.17 6.65 3.58 9 3.58z"/>
        </svg>
        Continue with Google
      </a>

      <p class="login-helper">Access is limited to accounts your admin has registered.</p>
    </div>
  </body>
</html>
